# PyHSM test tools, hash-pinned. Development and CI only; never installed in the image.
#
#   pip install --require-hashes -r requirements-dev.lock
#
# pip-audit reports PYSEC-2026-1845 for pytest 8.3.5 (fixed in 9.0.3). It affects test runs on a
# developer machine, not the key service. Upgrading needs the `pytest<9` bound in pyproject.toml
# lifted and the suite re-run on pytest 9.
-r requirements.lock

